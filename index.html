<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda Kerja Harian - Kreasi Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- NAVBAR -->
  <nav class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-lg sm:text-xl font-bold text-slate-900">Agenda Kerja Harian</h1>
        <p class="text-xs text-slate-500" id="modeSubtitle">Dashboard Publik (Hanya Lihat)</p>
      </div>
      
      <div class="flex items-center gap-2">
        <span id="userBadge" class="hidden text-xs font-semibold px-3 py-1.5 rounded-full"></span>
        <button id="btnOpenLogin" onclick="toggleLoginModal(true)" class="bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium px-4 py-2 rounded-lg transition">
          Login Akun
        </button>
        <button id="btnLogout" onclick="handleLogout()" class="hidden bg-rose-100 hover:bg-rose-200 text-rose-700 text-sm font-medium px-4 py-2 rounded-lg transition">
          Keluar
        </button>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTAINER -->
  <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">

    <!-- 1. BAGIAN KHUSUS INPUT AGENDA BARU (Hanya Muncul Setelah Login) -->
    <section id="inputSection" class="hidden bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="font-bold text-slate-800 text-base">Input Agenda Baru</h2>
          <p class="text-xs text-slate-500">
            Status awal otomatis <span class="font-semibold text-sky-600">On Progress</span> (otomatis menjadi <span class="font-semibold text-amber-600">Pending</span> jika lewat jam 17:00 belum selesai)
          </p>
        </div>
      </div>

      <form id="createAgendaForm" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal</label>
          <input type="date" id="createTanggal" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-500" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Waktu / Jam</label>
          <select id="createWaktu" required class="w-full border border-slate-300 bg-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-500">
            <!-- Diisi otomatis via JavaScript -->
          </select>
        </div>

        <div class="sm:col-span-2">
          <label class="block text-xs font-semibold text-slate-600 mb-1">Unit Pembuat (Otomatis)</label>
          <input type="text" id="createUnitDisplay" readonly class="w-full border border-slate-300 bg-slate-100 rounded-lg px-3 py-2 text-sm font-semibold text-slate-700 cursor-not-allowed" />
          <input type="hidden" id="createUnit" />
        </div>

        <!-- PILIHAN IRISAN UNIT LAIN -->
        <div class="col-span-full bg-slate-50 p-3 rounded-xl border border-slate-200">
          <label class="block text-xs font-semibold text-slate-700 mb-2">
            Irisan / Kolaborasi dengan Unit Lain <span class="font-normal text-slate-400">(Opsional — centang jika melibatkan unit lain)</span>
          </label>
          <div id="createIrisanContainer" class="flex flex-wrap gap-3">
            <!-- Diisi otomatis sesuai akun yang tidak sedang login -->
          </div>
        </div>

        <div class="sm:col-span-2 lg:col-span-3">
          <label class="block text-xs font-semibold text-slate-600 mb-1">Deskripsi Kegiatan / Agenda</label>
          <input type="text" id="createKegiatan" placeholder="Tulis detail agenda kerja..." required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-500" />
        </div>

        <div class="flex items-end">
          <button type="submit" id="btnCreateSubmit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-4 rounded-lg text-sm transition">
            + Tambah Agenda
          </button>
        </div>
      </form>
    </section>

    <!-- FILTER & LEGENDA WARNA -->
    <section class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col lg:flex-row lg:items-end justify-between gap-4">
      <div class="flex flex-wrap items-end gap-3">
        <div>
          <label class="block text-[11px] font-semibold text-slate-500 uppercase mb-1">Filter Tanggal</label>
          <div class="flex items-center gap-1.5">
            <input type="date" id="filterTanggal" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-medium" />
            <button type="button" id="btnSemuaTanggal" onclick="toggleSemuaTanggal()" class="border border-slate-300 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg px-3 py-1.5 text-xs font-semibold transition">
              Semua Tanggal
            </button>
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-500 uppercase mb-1">Filter Unit & Irisan</label>
          <select id="filterUnit" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-medium">
            <option value="ALL">Semua Unit</option>
            <option value="R&D">R&D (Hijau)</option>
            <option value="KTC">KTC (Biru)</option>
            <option value="SCD">SCD (Kuning)</option>
            <option value="Jadwal Bu Tanti">Jadwal Bu Tanti (Merah)</option>
          </select>
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-500 uppercase mb-1">Filter Status</label>
          <select id="filterStatus" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-medium">
            <option value="ALL">Semua Status</option>
            <option value="On Progress">On Progress</option>
            <option value="Pending">Pending</option>
            <option value="Selesai">Selesai</option>
          </select>
        </div>
      </div>

      <!-- LEGENDA WARNA UNIT -->
      <div class="flex flex-wrap items-center gap-2 text-xs font-medium">
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-emerald-100 text-emerald-800 border border-emerald-300">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-600"></span> R&D
        </span>
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-blue-100 text-blue-800 border border-blue-300">
          <span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span> KTC
        </span>
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-amber-100 text-amber-800 border border-amber-300">
          <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span> SCD
        </span>
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-rose-100 text-rose-800 border border-rose-300">
          <span class="w-2.5 h-2.5 rounded-full bg-rose-600"></span> Jadwal Bu Tanti
        </span>
      </div>
    </section>

    <!-- INFO RINGKASAN FILTER AKTIF -->
    <div id="filterSummaryBar" class="hidden bg-amber-50 border border-amber-200 text-amber-800 px-4 py-2.5 rounded-xl text-xs font-medium flex items-center justify-between">
      <span id="filterSummaryText">Menampilkan semua tanggal</span>
      <button onclick="resetToToday()" class="underline font-semibold hover:text-amber-950">Kembali ke Hari Ini</button>
    </div>

    <!-- DAFTAR AGENDA -->
    <section id="agendaList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="col-span-full text-center py-12 text-slate-400 text-sm">Memuat data agenda...</div>
    </section>

  </main>

  <!-- 2. BAGIAN KHUSUS EDIT AGENDA & STATUS (MODAL TERPISAH - HANYA PEMBUAT) -->
  <div id="editModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
      <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
        <div>
          <h3 class="text-base font-bold text-slate-900">Edit Agenda & Status</h3>
          <p class="text-xs text-slate-500" id="editUnitLabel">Unit Pembuat: -</p>
        </div>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-700 text-2xl leading-none">&times;</button>
      </div>

      <form id="editAgendaForm" class="space-y-4">
        <input type="hidden" id="editDocId" />

        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Update Status Agenda</label>
          <select id="editStatus" class="w-full border border-slate-300 bg-white rounded-lg px-3 py-2 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-slate-500">
            <option value="On Progress">🔄 On Progress</option>
            <option value="Pending">⏳ Pending</option>
            <option value="Selesai">✓ Selesai</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal</label>
            <input type="date" id="editTanggal" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Waktu / Jam</label>
            <select id="editWaktu" required class="w-full border border-slate-300 bg-white rounded-lg px-3 py-2 text-sm">
              <!-- Diisi otomatis via JavaScript -->
            </select>
          </div>
        </div>

        <!-- EDIT IRISAN UNIT LAIN -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">Irisan / Kolaborasi Unit Lain</label>
          <div id="editIrisanContainer" class="flex flex-wrap gap-2.5 bg-slate-50 p-2.5 rounded-lg border border-slate-200">
            <!-- Diisi otomatis -->
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Deskripsi Kegiatan / Agenda</label>
          <textarea id="editKegiatan" rows="3" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm"></textarea>
        </div>

        <div class="flex items-center justify-end gap-2 pt-2">
          <button type="button" onclick="closeEditModal()" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">
            Batal
          </button>
          <button type="submit" id="btnEditSubmit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg text-sm transition">
            Simpan Perubahan
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL LOGIN -->
  <div id="loginModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-slate-900">Login Akun Unit</h3>
        <button onclick="toggleLoginModal(false)" class="text-slate-400 hover:text-slate-700 text-xl leading-none">&times;</button>
      </div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Username</label>
          <input type="text" id="loginUsername" placeholder="Masukkan username (rnd / ktc / scd / butanti)" autocapitalize="none" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
        </div>
        <p id="loginError" class="hidden text-xs text-rose-600 font-medium"></p>
        <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-2.5 rounded-lg text-sm transition">
          Masuk
        </button>
      </form>
    </div>
  </div>

  <!-- FIREBASE SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAvqcNFeet47Ssj7xdMXLw3z3uy1rDfE_8",
      authDomain: "agenda-kerja-4d41f.firebaseapp.com",
      projectId: "agenda-kerja-4d41f",
      storageBucket: "agenda-kerja-4d41f.firebasestorage.app",
      messagingSenderId: "930285008440",
      appId: "1:930285008440:web:01f10ed1869ba450ef18cd",
      measurementId: "G-JCDFLR8DK4"
    };

    const ACCOUNTS = {
      "rnd":     { pass: "rndkreasi",     unit: "R&D",             label: "R&D (Hijau)" },
      "ktc":     { pass: "ktckreasi",     unit: "KTC",             label: "KTC (Biru)" },
      "scd":     { pass: "scdkreasi",     unit: "SCD",             label: "SCD (Kuning)" },
      "butanti": { pass: "butantikreasi", unit: "Jadwal Bu Tanti", label: "Jadwal Bu Tanti (Merah)" }
    };

    const ALL_UNITS = ["R&D", "KTC", "SCD", "Jadwal Bu Tanti"];

    const TIME_SLOTS = [
      "07:00 - 08:00",
      "08:00 - 09:00",
      "09:00 - 10:00",
      "10:00 - 11:00",
      "11:00 - 12:00",
      "12:00 - 13:00",
      "13:00 - 14:00",
      "14:00 - 15:00",
      "15:00 - 16:00",
      "16:00 - 17:00",
      "17:00 - 18:00",
      "08:00 - 12:00 (Sesi Pagi)",
      "13:00 - 17:00 (Sesi Siang - Sore)",
      "08:00 - 17:00 (Full Day)"
    ];

    function populateTimeDropdowns() {
      const optionsHTML = TIME_SLOTS.map(slot => `<option value="${slot}">${slot}</option>`).join('');
      document.getElementById('createWaktu').innerHTML = optionsHTML;
      document.getElementById('editWaktu').innerHTML = optionsHTML;
      document.getElementById('createWaktu').value = "08:00 - 09:00";
    }
    populateTimeDropdowns();

    const UNIT_STYLES = {
      "R&D": {
        card: "border-l-4 border-l-emerald-500 bg-white",
        badge: "bg-emerald-100 text-emerald-800 border-emerald-300",
        dot: "bg-emerald-500"
      },
      "KTC": {
        card: "border-l-4 border-l-blue-500 bg-white",
        badge: "bg-blue-100 text-blue-800 border-blue-300",
        dot: "bg-blue-500"
      },
      "SCD": {
        card: "border-l-4 border-l-amber-400 bg-white",
        badge: "bg-amber-100 text-amber-800 border-amber-300",
        dot: "bg-amber-500"
      },
      "Jadwal Bu Tanti": {
        card: "border-l-4 border-l-rose-500 bg-white",
        badge: "bg-rose-100 text-rose-800 border-rose-300",
        dot: "bg-rose-500"
      }
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let activeSession = JSON.parse(localStorage.getItem("agenda_session")) || null;
    let allAgendas = [];
    let isAllDatesMode = false;

    const todayStr = new Date().toLocaleDateString('en-CA');
    document.getElementById('filterTanggal').value = todayStr;
    document.getElementById('createTanggal').value = todayStr;

    // Format Tanggal Indonesia agar mudah dibaca (contoh: Rab, 25 Nov 2026)
    function formatTanggalIndo(dateStr) {
      if (!dateStr) return "-";
      const [y, m, d] = dateStr.split('-').map(Number);
      const dateObj = new Date(y, m - 1, d);
      return dateObj.toLocaleDateString('id-ID', {
        weekday: 'short',
        day: 'numeric',
        month: 'short',
        year: 'numeric'
      });
    }

    // Toggle Mode Semua Tanggal
    window.toggleSemuaTanggal = () => {
      isAllDatesMode = !isAllDatesMode;
      const filterInput = document.getElementById('filterTanggal');
      const btnSemua = document.getElementById('btnSemuaTanggal');
      const summaryBar = document.getElementById('filterSummaryBar');

      if (isAllDatesMode) {
        filterInput.value = "";
        btnSemua.classList.remove('bg-slate-100', 'text-slate-700', 'border-slate-300');
        btnSemua.classList.add('bg-slate-900', 'text-white', 'border-slate-900');
        summaryBar.classList.remove('hidden');
      } else {
        filterInput.value = todayStr;
        btnSemua.classList.add('bg-slate-100', 'text-slate-700', 'border-slate-300');
        btnSemua.classList.remove('bg-slate-900', 'text-white', 'border-slate-900');
        summaryBar.classList.add('hidden');
      }
      renderAgendas();
    };

    window.resetToToday = () => {
      isAllDatesMode = false;
      const filterInput = document.getElementById('filterTanggal');
      const btnSemua = document.getElementById('btnSemuaTanggal');
      const summaryBar = document.getElementById('filterSummaryBar');

      filterInput.value = todayStr;
      btnSemua.classList.add('bg-slate-100', 'text-slate-700', 'border-slate-300');
      btnSemua.classList.remove('bg-slate-900', 'text-white', 'border-slate-900');
      summaryBar.classList.add('hidden');
      renderAgendas();
    };

    // Jika user memilih tanggal manual di input date, matikan mode "Semua Tanggal"
    document.getElementById('filterTanggal').addEventListener('change', (e) => {
      const btnSemua = document.getElementById('btnSemuaTanggal');
      const summaryBar = document.getElementById('filterSummaryBar');
      if (e.target.value) {
        isAllDatesMode = false;
        btnSemua.classList.add('bg-slate-100', 'text-slate-700', 'border-slate-300');
        btnSemua.classList.remove('bg-slate-900', 'text-white', 'border-slate-900');
        summaryBar.classList.add('hidden');
      } else {
        isAllDatesMode = true;
        btnSemua.classList.remove('bg-slate-100', 'text-slate-700', 'border-slate-300');
        btnSemua.classList.add('bg-slate-900', 'text-white', 'border-slate-900');
        summaryBar.classList.remove('hidden');
      }
      renderAgendas();
    });

    // Jika user memilih status "Pending" dan belum aktif Semua Tanggal, tawarkan atau tampilkan info
    document.getElementById('filterStatus').addEventListener('change', (e) => {
      if (e.target.value === "Pending" && !isAllDatesMode) {
        // Otomatis pindah ke Semua Tanggal saat memilih filter status Pending
        // agar semua agenda Pending lintas tanggal langsung kelihatan
        toggleSemuaTanggal();
      } else {
        renderAgendas();
      }
    });

    document.getElementById('filterUnit').addEventListener('change', renderAgendas);

    function getEffectiveStatus(item) {
      if (item.status === "Selesai") return "Selesai";
      if (item.status === "Pending") return "Pending";

      const now = new Date();
      const currentDateStr = now.toLocaleDateString('en-CA');
      const currentHour = now.getHours();

      if (item.tanggal < currentDateStr || (item.tanggal === currentDateStr && currentHour >= 17)) {
        return "Pending";
      }
      return "On Progress";
    }

    function renderIrisanCheckboxes(containerId, ownerUnit, selectedUnits = []) {
      const container = document.getElementById(containerId);
      const otherUnits = ALL_UNITS.filter(u => u !== ownerUnit);

      container.innerHTML = otherUnits.map(u => {
        const checked = selectedUnits.includes(u) ? "checked" : "";
        const style = UNIT_STYLES[u];
        return `
          <label class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 cursor-pointer text-xs font-semibold text-slate-700 select-none">
            <input type="checkbox" name="${containerId}_irisan" value="${u}" ${checked} class="rounded text-slate-900 focus:ring-slate-500" />
            <span class="w-2 h-2 rounded-full ${style.dot}"></span>
            <span>${u}</span>
          </label>
        `;
      }).join('');
    }

    function getSelectedIrisan(containerId) {
      return Array.from(document.querySelectorAll(`input[name="${containerId}_irisan"]:checked`))
        .map(cb => cb.value);
    }

    window.toggleLoginModal = (show) => {
      document.getElementById('loginModal').classList.toggle('hidden', !show);
      document.getElementById('loginError').classList.add('hidden');
    };

    window.openEditModal = (id) => {
      const item = allAgendas.find(a => a.id === id);
      if (!item) return;

      if (!activeSession || item.unit !== activeSession.unit) return;

      document.getElementById('editDocId').value = item.id;
      document.getElementById('editUnitLabel').textContent = `Unit Pembuat: ${item.unit}`;
      document.getElementById('editStatus').value = getEffectiveStatus(item);
      document.getElementById('editTanggal').value = item.tanggal;
      
      const editWaktuEl = document.getElementById('editWaktu');
      if (!TIME_SLOTS.includes(item.waktu)) {
        const tempOpt = document.createElement('option');
        tempOpt.value = item.waktu;
        tempOpt.textContent = item.waktu;
        editWaktuEl.appendChild(tempOpt);
      }
      editWaktuEl.value = item.waktu;
      
      renderIrisanCheckboxes('editIrisanContainer', item.unit, item.irisan || []);
      document.getElementById('editKegiatan').value = item.kegiatan;
      document.getElementById('editModal').classList.remove('hidden');
    };

    window.closeEditModal = () => {
      document.getElementById('editModal').classList.add('hidden');
      document.getElementById('editAgendaForm').reset();
    };

    function updateAuthUI() {
      const btnOpenLogin = document.getElementById('btnOpenLogin');
      const btnLogout = document.getElementById('btnLogout');
      const inputSection = document.getElementById('inputSection');
      const userBadge = document.getElementById('userBadge');
      const modeSubtitle = document.getElementById('modeSubtitle');
      const createUnit = document.getElementById('createUnit');
      const createUnitDisplay = document.getElementById('createUnitDisplay');

      if (activeSession) {
        btnOpenLogin.classList.add('hidden');
        btnLogout.classList.remove('hidden');
        inputSection.classList.remove('hidden');

        userBadge.classList.remove('hidden');
        userBadge.textContent = `Unit: ${activeSession.unit}`;
        userBadge.className = `text-xs font-semibold px-3 py-1.5 rounded-full border ${UNIT_STYLES[activeSession.unit]?.badge || 'bg-slate-100'}`;

        modeSubtitle.textContent = `Login sebagai: ${activeSession.username.toUpperCase()}`;
        createUnit.value = activeSession.unit;
        createUnitDisplay.value = activeSession.label || activeSession.unit;

        renderIrisanCheckboxes('createIrisanContainer', activeSession.unit, []);
      } else {
        btnOpenLogin.classList.remove('hidden');
        btnLogout.classList.add('hidden');
        inputSection.classList.add('hidden');
        userBadge.classList.add('hidden');
        modeSubtitle.textContent = "Dashboard Publik (Hanya Lihat)";
      }
      renderAgendas();
    }

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const uname = document.getElementById('loginUsername').value.trim().toLowerCase();
      const pass = document.getElementById('loginPassword').value;
      const errEl = document.getElementById('loginError');

      const account = ACCOUNTS[uname];
      if (account && account.pass === pass) {
        activeSession = {
          username: uname,
          unit: account.unit,
          label: account.label
        };
        localStorage.setItem("agenda_session", JSON.stringify(activeSession));
        toggleLoginModal(false);
        document.getElementById('loginForm').reset();
        updateAuthUI();
      } else {
        errEl.textContent = "Username atau password salah.";
        errEl.classList.remove('hidden');
      }
    });

    window.handleLogout = () => {
      activeSession = null;
      localStorage.removeItem("agenda_session");
      closeEditModal();
      updateAuthUI();
    };

    document.getElementById('createAgendaForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!activeSession) return;

      const btn = document.getElementById('btnCreateSubmit');
      btn.disabled = true;
      btn.textContent = "Menyimpan...";

      try {
        const irisanSelected = getSelectedIrisan('createIrisanContainer');
        await addDoc(collection(db, "agendas"), {
          tanggal: document.getElementById('createTanggal').value,
          waktu: document.getElementById('createWaktu').value,
          unit: activeSession.unit,
          irisan: irisanSelected,
          kegiatan: document.getElementById('createKegiatan').value.trim(),
          status: "On Progress",
          createdBy: activeSession.username,
          createdAt: new Date().toISOString()
        });

        document.getElementById('createKegiatan').value = "";
        renderIrisanCheckboxes('createIrisanContainer', activeSession.unit, []);
      } catch (err) {
        alert("Gagal menambah agenda: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "+ Tambah Agenda";
      }
    });

    document.getElementById('editAgendaForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!activeSession) return;

      const docId = document.getElementById('editDocId').value;
      const item = allAgendas.find(a => a.id === docId);
      if (!item || item.unit !== activeSession.unit) return;

      const btn = document.getElementById('btnEditSubmit');
      btn.disabled = true;
      btn.textContent = "Menyimpan...";

      try {
        const irisanSelected = getSelectedIrisan('editIrisanContainer');
        await updateDoc(doc(db, "agendas", docId), {
          status: document.getElementById('editStatus').value,
          tanggal: document.getElementById('editTanggal').value,
          waktu: document.getElementById('editWaktu').value,
          irisan: irisanSelected,
          kegiatan: document.getElementById('editKegiatan').value.trim(),
          updatedBy: activeSession.username,
          updatedAt: new Date().toISOString()
        });
        closeEditModal();
      } catch (err) {
        alert("Gagal menyimpan perubahan: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Simpan Perubahan";
      }
    });

    window.quickMarkSelesai = async (id, currentEffectiveStatus) => {
      const item = allAgendas.find(a => a.id === id);
      if (!activeSession || !item || item.unit !== activeSession.unit) return;

      const nextStatus = currentEffectiveStatus === "Selesai" ? "On Progress" : "Selesai";
      try {
        await updateDoc(doc(db, "agendas", id), {
          status: nextStatus,
          updatedBy: activeSession.username,
          updatedAt: new Date().toISOString()
        });
      } catch (err) {
        alert("Gagal mengubah status.");
      }
    };

    window.deleteAgenda = async (id) => {
      const item = allAgendas.find(a => a.id === id);
      if (!activeSession || !item || item.unit !== activeSession.unit) return;

      if (!confirm("Yakin ingin menghapus agenda ini?")) return;
      try {
        await deleteDoc(doc(db, "agendas", id));
      } catch (err) {
        alert("Gagal menghapus agenda.");
      }
    };

    const q = query(collection(db, "agendas"), orderBy("waktu", "asc"));
    onSnapshot(q, (snapshot) => {
      allAgendas = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      renderAgendas();
    });

    setInterval(renderAgendas, 60000);

    function renderAgendas() {
      const container = document.getElementById('agendaList');
      const fTanggal = isAllDatesMode ? "" : document.getElementById('filterTanggal').value;
      const fUnit = document.getElementById('filterUnit').value;
      const fStatus = document.getElementById('filterStatus').value;

      let filtered = allAgendas.filter(item => {
        const effectiveStatus = getEffectiveStatus(item);
        const matchTanggal = !fTanggal || item.tanggal === fTanggal;
        const irisanList = Array.isArray(item.irisan) ? item.irisan : [];
        const matchUnit = fUnit === "ALL" || item.unit === fUnit || irisanList.includes(fUnit);
        const matchStatus = fStatus === "ALL" || effectiveStatus === fStatus;
        return matchTanggal && matchUnit && matchStatus;
      });

      // Jika mode Semua Tanggal aktif, urutkan tanggal terbaru ke terlama lalu berdasarkan jam
      if (isAllDatesMode) {
        filtered.sort((a, b) => {
          if (a.tanggal !== b.tanggal) return b.tanggal.localeCompare(a.tanggal);
          return (a.waktu || "").localeCompare(b.waktu || "");
        });
        document.getElementById('filterSummaryText').textContent =
          `Menampilkan ${filtered.length} agenda dari semua tanggal` + (fStatus !== "ALL" ? ` (Status: ${fStatus})` : '');
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full bg-white border border-dashed border-slate-300 rounded-xl p-10 text-center text-slate-400 text-sm">
            Belum ada agenda untuk tanggal/filter ini.
          </div>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const style = UNIT_STYLES[item.unit] || { card: "border-l-4 border-slate-400 bg-white", badge: "bg-slate-100 text-slate-700" };
        const effectiveStatus = getEffectiveStatus(item);
        const isSelesai = effectiveStatus === "Selesai";
        const isPending = effectiveStatus === "Pending";
        const irisanList = Array.isArray(item.irisan) ? item.irisan : [];
        
        const isCreator = activeSession && item.unit === activeSession.unit;

        const irisanBadges = irisanList.length > 0
          ? irisanList.map(u => {
              const uStyle = UNIT_STYLES[u] || { badge: "bg-slate-100 text-slate-700 border-slate-300" };
              return `<span class="text-[11px] font-semibold px-2 py-0.5 rounded-md border ${uStyle.badge}">+ ${u}</span>`;
            }).join('')
          : '';

        let statusBadge = '';
        if (isSelesai) {
          statusBadge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 shrink-0">✓ Selesai</span>`;
        } else if (isPending) {
          statusBadge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200 shrink-0">⏳ Pending</span>`;
        } else {
          statusBadge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-sky-50 text-sky-700 border border-sky-200 shrink-0">🔄 On Progress</span>`;
        }

        const actionButtons = isCreator ? `
          <div class="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
            <button onclick="quickMarkSelesai('${item.id}', '${effectiveStatus}')" class="text-xs font-medium px-2.5 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 transition">
              ${isSelesai ? 'Kembalikan Status' : '✓ Tandai Selesai'}
            </button>
            <div class="flex items-center gap-3">
              <button onclick="openEditModal('${item.id}')" class="text-xs font-semibold text-blue-600 hover:underline">Edit / Status</button>
              <button onclick="deleteAgenda('${item.id}')" class="text-xs font-medium text-rose-600 hover:underline">Hapus</button>
            </div>
          </div>
        ` : (activeSession && irisanList.includes(activeSession.unit) ? `
          <div class="mt-3 pt-2.5 border-t border-slate-100">
            <p class="text-[11px] text-slate-400 italic">🤝 Agenda irisan dari <strong class="text-slate-600">${item.unit}</strong> (Hanya pembuat yang dapat mengedit)</p>
          </div>
        ` : '');

        return `
          <div class="${style.card} rounded-xl border border-slate-200 p-4 shadow-xs flex flex-col justify-between transition hover:shadow-md">
            <div>
              <div class="flex items-start justify-between gap-2 mb-2">
                <div class="flex flex-wrap items-center gap-1.5">
                  <span class="text-xs font-bold px-2.5 py-0.5 rounded-md border ${style.badge}">${item.unit}</span>
                  ${irisanBadges}
                </div>
                ${statusBadge}
              </div>
              <p class="text-xs font-semibold text-slate-500 mb-1.5">
                📅 <span class="text-slate-700">${formatTanggalIndo(item.tanggal)}</span> &bull; 🕒 ${item.waktu}
              </p>
              <p class="text-sm sm:text-base font-medium text-slate-800 ${isSelesai ? 'line-through text-slate-400' : ''}">
                ${escapeHTML(item.kegiatan)}
              </p>
            </div>
            ${actionButtons}
          </div>
        `;
      }).join('');
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag]));
    }

    updateAuthUI();
  </script>
</body>
</html>
